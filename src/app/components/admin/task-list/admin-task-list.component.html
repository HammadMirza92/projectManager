<div class="admin-task-list-container">

  <!-- Page header -->
  <div class="header-section">
    <div class="header-title">
      <div *ngIf="!projectId" class="page-heading">
        <mat-icon class="heading-icon">assignment</mat-icon>
        <div>
          <h1>Task Management</h1>
          <span class="heading-sub">View, create and manage all tasks</span>
        </div>
      </div>
      <div *ngIf="projectId" class="project-header">
        <button mat-icon-button (click)="backToProjects()" matTooltip="Back to Projects">
          <mat-icon>arrow_back</mat-icon>
        </button>
        <div>
          <h1>{{ project?.title || 'Loading…' }}</h1>
          <span class="heading-sub">Task list for this project</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="openTaskForm()">
        <mat-icon>add</mat-icon> Add Task
      </button>
    </div>
  </div>

  <!-- Loading/error states for project details -->
  <div class="loading-row" *ngIf="loading">
    <mat-spinner diameter="36"></mat-spinner>
  </div>
  <div class="error-banner" *ngIf="error">
    <mat-icon>error_outline</mat-icon> {{ error }}
  </div>

  <!-- Task list card -->
  <mat-card class="content-card">
    <app-task-list
      [projectId]="projectId"
      [showActions]="true"
      [showProject]="!projectId"
      [showFilters]="true"
      (taskUpdated)="onTaskUpdated()">
    </app-task-list>
  </mat-card>

</div>
