<div class="container">

  <!-- ── Header ──────────────────────────────────────────────── -->
  <div class="header">
    <div class="header-left">
      <mat-icon class="heading-icon">manage_accounts</mat-icon>
      <div>
        <h1 class="title">Manage Users</h1>
        <span class="heading-sub">Admins, developers and clients</span>
      </div>
    </div>
    <button mat-raised-button color="primary" (click)="addNewUser()" style="border-radius:8px">
      <mat-icon>person_add</mat-icon> Add User
    </button>
  </div>

  <!-- ── Data card ────────────────────────────────────────────── -->
  <mat-card class="data-card">
    <mat-card-content>

      <!-- Search -->
      <div class="search-bar">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Search users</mat-label>
          <mat-icon matPrefix>search</mat-icon>
          <input matInput (keyup)="applyFilter($event)" placeholder="Name, email…" #input>
        </mat-form-field>
      </div>

      <div class="table-container">
        <div class="loading-shade" *ngIf="isLoading">
          <mat-spinner diameter="50"></mat-spinner>
        </div>

        <table mat-table [dataSource]="dataSource" matSort>

          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
            <td mat-cell *matCellDef="let user">{{ user.id }}</td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>User</th>
            <td mat-cell *matCellDef="let user">
              <div class="person-cell">
                <div class="avatar" [ngClass]="getAvatarClass(user.role)">
                  {{ user.name?.charAt(0)?.toUpperCase() }}
                </div>
                <div class="user-info">
                  <span class="user-name">{{ user.name }}</span>
                </div>
              </div>
            </td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
            <td mat-cell *matCellDef="let user">
              <span class="email-val">{{ user.email }}</span>
            </td>
          </ng-container>

          <!-- Role Column -->
          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
            <td mat-cell *matCellDef="let user">
              <span class="role-badge" [ngClass]="getRoleBadgeClass(user.role)">
                {{ user.role }}
              </span>
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let user">
              <button mat-icon-button class="action-btn edit-btn" (click)="editUser(user.id)" matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button class="action-btn del-btn" (click)="deleteUser(user)" matTooltip="Delete">
                <mat-icon>delete_outline</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="5">
              <div class="no-data">
                <mat-icon>person_off</mat-icon>
                <p *ngIf="input.value">No users matching "{{ input.value }}"</p>
                <p *ngIf="!input.value">No users found</p>
              </div>
            </td>
          </tr>
        </table>

        <mat-paginator [length]="totalUsers" [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 50]" (page)="onPageChange($event)"></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
